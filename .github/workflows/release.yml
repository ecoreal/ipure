name: Release
# Publishes to npm when a v* tag is pushed — but only if the NPM_TOKEN secret
# exists. Add it once with:  gh secret set NPM_TOKEN  (an npm granular token
# with Publish permission) and every future `git tag v0.x.y && git push --tags`
# ships to npm automatically.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: node --test test/*.test.js
      - id: token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - run: npm publish
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
